<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juice Login Lab</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><header>Juice Login Lab <span>Student security project</span></header>
<main><section class="card" aria-labelledby="title"><p class="eyebrow">WELCOME BACK</p><h1 id="title">Login</h1><p>Sign in with your local demo account.</p>
<form id="login-form" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
<button type="submit">Log in</button></form>
<p id="message" role="status" aria-live="polite"></p><p id="submitted" class="submitted"></p>
<p class="footnote">Inspired by OWASP Juice Shop. A separate local learning app; no real accounts.</p></section></main></body></html>
